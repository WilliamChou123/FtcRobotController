buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }

    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}
apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'
repositories {
    maven {
        url = "https://repo.dairy.foundation/releases"
    }
    maven { url = 'https://jitpack.io' }

}
android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

configurations {
    // Plain-JVM runtime used only by the desktop emulator JavaExec task.
    emulatorRuntime
}

dependencies {
    implementation project(':FtcRobotController')
        implementation("dev.frozenmilk.sinister:Sloth:0.3.2")
    testImplementation 'com.github.alonHamb:ftc-control-hub-emulator:v1.0.3'
    emulatorRuntime 'com.github.alonHamb:ftc-control-hub-emulator:v1.0.3'

}

tasks.register('runAutoPathEmulator', JavaExec) {
    group = 'application'
    description = 'Launches the desktop FTC AutoPath emulator GUI.'

    def compileEmulator = tasks.named('compileDebugUnitTestJavaWithJavac')
    dependsOn compileEmulator
    classpath = files(compileEmulator.get().destinationDirectory)
    classpath += compileEmulator.get().classpath
    classpath += configurations.emulatorRuntime

    mainClass.set('org.firstinspires.ftc.teamcode.emulator.EmulatorRunner')
    standardInput = System.in
}
